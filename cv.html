<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CV Poster Service</title>
<style>
body {
    font-family: Arial, sans-serif;
    background: #f9f9f9;
    margin: 0;
    padding: 0;
}

header {
    background: #3498db;
    color: white;
    padding: 15px;
    text-align: center;
}

main {
    max-width: 700px;
    margin: auto;
    padding: 20px;
    background: white;
    margin-top: 20px;
    border-radius: 8px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.1);
}

form input,
form select,
form textarea,
form button {
    width: 100%;
    padding: 10px;
    margin: 8px 0;
    border-radius: 5px;
    border: 1px solid #ccc;
    box-sizing: border-box;
    font-family: "Comic Sans MS", sans-serif;
}

form button {
    background: #3498db;
    color: white;
    font-size: 16px;
    border: none;
    cursor: pointer;
}

form button:hover {
    background: #2980b9;
}
</style>
</head>
<body>

<header>
    <h1>CV Poster Request</h1>
</header>

<main>
<form id="serviceForm" data-service="CV Poster">
    <input type="text" id="fullName" placeholder="Full Name" required>
    <input type="email" id="email" placeholder="Email" required>
    <input type="text" id="phone" placeholder="Phone Number" required>
    <textarea id="education" placeholder="Education Details" required></textarea>
    <textarea id="experience" placeholder="Experience Details" required></textarea>
    <textarea id="skills" placeholder="Skills" required></textarea>
    
    <label for="cvFile">Upload Your CV Document:</label>
    <input type="file" id="cvFile" accept=".pdf,.doc,.docx" required>
    
    <label for="receivingMethod">Receiving Method:</label>
    <select id="receivingMethod" required>
        <option value="">-- Select --</option>
        <option value="Online">Online&Delivery</option>
        <option value="Contact">Contact&Collect</option>
    </select>
    
    <input type="text" id="contact" placeholder="Your Contact number">
    <button type="submit">Submit CV Poster Request</button>
</form>
</main>

<script>
const currentUser = JSON.parse(localStorage.getItem("currentUser"));
if (!currentUser) {
    alert("Please log in first.");
    window.location.href = "customerLogin.html";
}

document.getElementById("serviceForm").addEventListener("submit", function(e) {
    e.preventDefault();

    const fileInput = document.getElementById("cvFile");
    const file = fileInput.files[0];

    if (file) {
        const reader = new FileReader();
        reader.onload = function(event) {
            const fileContent = event.target.result;

            const cvRequest = {
                username: currentUser.username,
                service: "CV Poster",
                fullName: document.getElementById("fullName").value,
                email: document.getElementById("email").value,
                phone: document.getElementById("phone").value,
                education: document.getElementById("education").value,
                experience: document.getElementById("experience").value,
                skills: document.getElementById("skills").value,
                cvFileName: file.name,
                cvFileData: fileContent,
                receivingMethod: document.getElementById("receivingMethod").value,
                contact: document.getElementById("contact").value,
                requestedAt: new Date().toLocaleString()
            };

            let serviceRequests = JSON.parse(localStorage.getItem("serviceRequests")) || [];
            serviceRequests.push(cvRequest);
            localStorage.setItem("serviceRequests", JSON.stringify(serviceRequests));

            alert("✅ Your CV Poster request has been submitted!");
            window.location.href = "payment.html";
        };
        reader.readAsDataURL(file);
    } else {
        alert("Please upload your CV document.");
    }
});
</script>
</body>
</html>
