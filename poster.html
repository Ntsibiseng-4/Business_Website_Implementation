<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Poster Design Service</title>
  <link rel="stylesheet" href="dashboard.css">
</head>
<style>
  body {
  font-family: Arial, sans-serif;
  margin: 0;
  background-color: #ffffff;
}

header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  background-color: #3498db;
  padding: 15px 30px;
  color: white;
}

header h1 {
  margin: 0;
}

header button {
  background-color: #c0392b;
  border: none;
  padding: 8px 15px;
  border-radius: 5px;
  cursor: pointer;
  color: white;
}

main {
  max-width: 700px;
  margin: 100px auto;
  padding: 25px;
  background-color: #f1f1f1;
  border-radius: 10px;
  text-align: center;
}

p {
  font-size: 18px;
}

</style>
<body>
<header>
  <h1>Job Application</h1>
  <button onclick="goBack()">Back to Dashboard</button>
</header>

<main>
  <form id="jobForm">
    <input type="text" id="jobTitle" placeholder="Desired Job Title" required>
    <textarea id="instructions" placeholder="Additional Details / Instructions"></textarea>

    <label for="jobFile">Upload Your CV / Supporting Documents (PDF, DOCX):</label>
    <input type="file" id="jobFile" name="jobFile" accept=".pdf,.doc,.docx">

    <label for="deliveryOption">Receive Method:</label>
    <select id="deliveryOption" required>
      <option value="person">In-Person</option>
      <option value="onine">Online</option>
    </select>

    <button type="submit">Submit Job Application Request</button>
  </form>
</main>

<script>

  const currentUser = JSON.parse(localStorage.getItem("currentUser"));
  if (!currentUser) {
      alert("Please log in first.");
      window.location.href = "login.html";
  }

  function logout() {
      localStorage.removeItem("currentUser");
      window.location.href = "login.html";
  }

   // Back to dashboard function
  function goBack() {
    window.location.href = "dashboard.html";
  }

  const jobForm = document.getElementById("jobForm");
  jobForm.addEventListener("submit", function(e) {
      e.preventDefault();

      const fileInput = document.getElementById("jobFile");
      const file = fileInput.files[0];

      if (file) {
        const reader = new FileReader();
        reader.onload = function(event) {
            const fileContent = event.target.result;

            const jobRequest = {
                user: currentUser.username,
                service: "Job Application",
                jobTitle: document.getElementById("jobTitle").value,
                instructions: document.getElementById("instructions").value,
                deliveryOption: document.getElementById("deliveryOption").value,
                fileData: fileContent,
                fileName: file.name,
                requestedAt: new Date().toLocaleString()
            };

            let serviceRequests = JSON.parse(localStorage.getItem("serviceRequests")) || [];
            serviceRequests.push(jobRequest);
            localStorage.setItem("serviceRequests", JSON.stringify(serviceRequests));

            alert(`✅ Your Job Application request has been submitted! Method: ${jobRequest.deliveryOption}`);
            window.location.href = "payment.html";
        };
        reader.readAsDataURL(file);
      } else {
          // If no file uploaded, still allow request
          const jobRequest = {
              user: currentUser.username,
              service: "Job Application",
              jobTitle: document.getElementById("jobTitle").value,
              instructions: document.getElementById("instructions").value,
              deliveryOption: document.getElementById("deliveryOption").value,
              fileData: null,
              fileName: null,
              requestedAt: new Date().toLocaleString()
          };

          let serviceRequests = JSON.parse(localStorage.getItem("serviceRequests")) || [];
          serviceRequests.push(jobRequest);
          localStorage.setItem("serviceRequests", JSON.stringify(serviceRequests));

          alert(`✅ Your Job Application request has been submitted! Method: ${jobRequest.deliveryOption}`);
          window.location.href = "payment.html";
      }
  });
</script>

</body>
</html>
