<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Payment Successful</title>
<style>
body {
    font-family: Arial, sans-serif;
    background: #f0fdf4;
    margin: 0;
    padding: 0;
}

header {
    background: #3498db;
    color: white;
    padding: 15px;
    text-align: center;
}

main {
    max-width: 600px;
    margin: 40px auto;
    background: white;
    padding: 30px;
    border-radius: 8px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.15);
    text-align: center;
}

h2 {
    margin-bottom: 15px;
}

p {
    font-size: 16px;
    margin: 8px 0;
}

.summary-box {
    background: #f1f1f1;
    padding: 15px;
    border-radius: 6px;
    margin: 20px 0;
    text-align: left;
}

button {
    padding: 12px 18px;
    border: none;
    border-radius: 5px;
    background: #2ecc71;
    color: white;
    font-size: 16px;
    cursor: pointer;
}

button:hover {
    background: #27ae60;
}
</style>
</head>
<body>

<header>
  <h1>Payment Confirmation</h1>
</header>

<main>
  <h2>✅ Payment Successful</h2>
  <p>Thank you! Your payment has been received and recorded.</p>

  <div class="summary-box" id="paymentSummary">
    <!-- Payment details will appear here -->
  </div>

  <button onclick="goToDashboard()">Go to Dashboard</button>
</main>

<script>
const payments = JSON.parse(localStorage.getItem("payments")) || [];
const lastPayment = payments[payments.length - 1];

const summaryDiv = document.getElementById("paymentSummary");
if(lastPayment){
    summaryDiv.innerHTML = `
        <h3>Payment Details</h3>
        <p><strong>User:</strong> ${lastPayment.user}</p>
        <p><strong>Service:</strong> ${lastPayment.service}</p>
        <p><strong>Method:</strong> ${lastPayment.paymentMethod}</p>
        <p><strong>Reference:</strong> ${lastPayment.transactionRef || "-"}</p>
        <p><strong>Date:</strong> ${lastPayment.paidAt}</p>
    `;
} else {
    summaryDiv.innerHTML = "<p>No payment found.</p>";
}

function goToDashboard(){
    window.location.href = "Customerdashboard.html";
}
</script>

</body>
</html>
