<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Dashboard</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=home" />
  <style>
      .material-symbols-outlined {
  font-variation-settings:
  'FILL' 0,
  'wght' 400,
  'GRAD' 0,
  'opsz' 24
}


    body {
  font-family: Arial, sans-serif;
  margin: 0;
  background: #f9f9f9;
  color: #333;
}

header {
   display: flex;
   align-items: center;
   justify-content: space-between;
   padding: 15px 40px;
   border-bottom: 2px solid #f0f0f0;
   background-color: #ffffff;
   box-shadow: 0 2px 5px rgba(0,0,0,0.1);
   position: sticky;
   top: 80;
   z-index: 500;
}

header h1 {
  margin: 0;
  font-size: 20px;
}

header button {
  background: #e74c3c;
  border: none;
  padding: 8px 15px;
  color: white;
  font-weight: bold;
  border-radius: 4px;
  cursor: pointer;
}

.header-right a {
  border: none;
  padding: 7px 10px;
  color: #2980b9;
  font-weight: bold;
  border-radius: 4px;
  cursor: pointer;
  transition: 0.3s;
  background-color: #f1f1f1;
  margin-top: 2px; 
  display: inline-block;
}

.header-right a:hover {
  background-color: #1f5c8b;
}


main {
  max-width: 900px;
  margin: 40px auto;
  padding: 20px;
}

table {
  width: 100%;
  border-collapse: collapse;
  margin-top: 20px;
}

th, td {
  border: 1px solid #ccc;
  padding: 10px;
  text-align: left;
}

th {
  background: #3498db;
  color: white;
}

tr:nth-child(even) {
  background: #f2f2f2;
}

  </style>
</head>
<body>
  <header>
    <h1>Admin Dashboard</h1>
     <div class="header-right">
    <a href="index.html"> <span class="material-symbols-outlined">
home
</span></a>
    <button id="logoutBtn">Logout</button>
  </header>

  <main>
    <h2>Service Requests</h2>

    <div class="filter">
    <label for="serviceFilter">Filter by Service:</label>
    <select id="serviceFilter">
      <option value="all">All</option>
      <option value="CV Poster">CV Poster</option>
      <option value="Printing">Printing</option>
      <option value="Website Assistance">Website Assistance</option>
    </select>
  </div>

    <table id="requestsTable">
      <thead>
        <tr>
          <th>Username</th>
          <th>Service</th>
          <th>Requested Time</th>
        </tr>
      </thead>
      <tbody>
        <!-- Requests will be populated here -->
      </tbody>
    </table>
  </main>

  <script src="admin.js"></script>
</body>
</html>
